    <script>
      // ── THEME ──
      (function () {
        const saved = localStorage.getItem("theme");
        const prefersDark =
          !saved && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || prefersDark)
          document.documentElement.classList.add("dark");
        else if (saved === "light")
          document.documentElement.classList.add("light");
      })();

      // ── I18N ──
      // ── Para agregar un idioma: 1 entrada aquí + crear public/i18n/XX.json ──
      const LANGS = [
        { code: "es", name: "Español",   flag: "https://flagcdn.com/w20/es.png" },
        { code: "en", name: "English",   flag: "https://flagcdn.com/w20/us.png" },
        { code: "pt", name: "Português", flag: "https://flagcdn.com/w20/pt.png" },
      ];

      const I18N = {}; // cache — se carga bajo demanda desde /i18n/XX.json

      async function loadLang(lang) {
        if (I18N[lang]) return;
        try {
          const res = await fetch(`/i18n/${lang}.json`);
          I18N[lang] = await res.json();
        } catch {
          if (!I18N[lang]) I18N[lang] = I18N.es || {};
        }
      }



      let currentLang = localStorage.getItem("lang") || "es";

      function t(key) {
        return (I18N[currentLang] || {})[key] ?? key;
      }

      function tResults(n) {
        const T = I18N[currentLang] || {};
        return n === 1
          ? (T.resultsOne || `${n}`)
          : (T.resultsMany || `${n}`).replace("{n}", n);
      }

      async function applyLang(lang) {
        await loadLang(lang);
        currentLang = lang;
        localStorage.setItem("lang", lang);
        const T = I18N[lang];
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const k = el.dataset.i18n;
          if (T[k] !== undefined) el.textContent = T[k];
        });
        document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
          const k = el.dataset.i18nPh;
          if (T[k] !== undefined) el.placeholder = T[k];
        });
        updateLangBtn();
        if (document.getElementById("tnc-overlay").classList.contains("open")) renderTnc();
        updateBtn(document.documentElement.classList.contains("dark"));
        if (typeof LABELS_FILTRO !== "undefined") {
          Object.assign(LABELS_FILTRO, T.labelsFilter);
        }
        if (typeof renderFiltrosActivos === "function" && typeof filtrosActivos !== "undefined") {
          renderFiltrosActivos();
        }
        if (typeof todosLosComics !== "undefined" && todosLosComics.length > 0) {
          if (typeof poblarSelects === "function") poblarSelects(todosLosComics);
          if (typeof renderGrid === "function")
            renderGrid(typeof filtrarComics === "function" ? filtrarComics() : todosLosComics);
        }
      }

      function updateLangBtn() {
        const lang = LANGS.find(l => l.code === currentLang) || LANGS[0];
        document.querySelectorAll(".lang-flag")
          .forEach(el => { el.src = lang.flag; el.alt = currentLang.toUpperCase(); });
        document.querySelectorAll(".lang-name")
          .forEach(el => el.textContent = (I18N[currentLang] || {}).name || currentLang);
        document.querySelectorAll(".lang-option")
          .forEach(opt => opt.classList.toggle("active", opt.dataset.lang === currentLang));
      }

      function renderLangDropdowns() {
        const html = LANGS.map(l => `
          <button class="lang-option${l.code === currentLang ? " active" : ""}"
                  data-lang="${l.code}" onclick="selectLang('${l.code}')">
            <img class="lang-flag-big" src="${l.flag}" alt="${l.code.toUpperCase()}" /> ${l.name}
          </button>`).join("");
        document.querySelectorAll(".lang-dropdown").forEach(dd => dd.innerHTML = html);
      }

      function toggleLangDropdown(btn) {
        const switcher = btn.closest(".lang-switcher");
        const dd = switcher.querySelector(".lang-dropdown");
        document.querySelectorAll(".lang-dropdown.open").forEach((d) => {
          if (d !== dd) {
            d.classList.remove("open");
            d.closest(".lang-switcher").querySelector(".btn-lang").classList.remove("open");
          }
        });
        const isOpen = dd.classList.toggle("open");
        btn.classList.toggle("open", isOpen);
      }

      async function selectLang(lang) {
        document.querySelectorAll(".lang-dropdown").forEach(d => d.classList.remove("open"));
        document.querySelectorAll(".btn-lang").forEach(b => b.classList.remove("open"));
        await applyLang(lang);
      }

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".lang-switcher")) {
          document
            .querySelectorAll(".lang-dropdown")
            .forEach((d) => d.classList.remove("open"));
          document
            .querySelectorAll(".btn-lang")
            .forEach((b) => b.classList.remove("open"));
        }
      });

      function updateBtn(isDark) {
        const T = I18N[currentLang];
        const label = isDark
          ? `<span class="theme-icon">☀</span><span class="btn-theme-label"> ${T.light}</span>`
          : `<span class="theme-icon">☽</span><span class="btn-theme-label"> ${T.dark}</span>`;
        ["btn-theme-toolbar", "btn-theme-visor"].forEach((id) => {
          const btn = document.getElementById(id);
          if (btn) btn.innerHTML = label;
        });
      }
      function toggleTheme() {
        const html = document.documentElement;
        const isDark = html.classList.toggle("dark");
        html.classList.toggle("light", !isDark);
        localStorage.setItem("theme", isDark ? "dark" : "light");
        updateBtn(isDark);
      }
      document.addEventListener("DOMContentLoaded", async () => {
        await applyLang(currentLang);
        renderLangDropdowns();
      });
    </script>

    <script>
      const API_URL = "";
      let todosLosComics = [];
      let filtrosActivos = {};
      let busquedaActiva = "";
      let scrollHandlerLectura = null;
      let maxPaginaVista = 0;
      let saltarScrollHandler = false;
      let lastImgObserver = null;
      let transicionando = false;

      const LANG_FLAGS = {
        en: "https://flagcdn.com/w20/us.png",
        es: "https://flagcdn.com/w20/es.png",
        ja: "https://flagcdn.com/w20/jp.png",
        fr: "https://flagcdn.com/w20/fr.png",
        de: "https://flagcdn.com/w20/de.png",
        pt: "https://flagcdn.com/w20/pt.png",
        it: "https://flagcdn.com/w20/it.png",
        zh: "https://flagcdn.com/w20/cn.png",
        ko: "https://flagcdn.com/w20/kr.png",
        ru: "https://flagcdn.com/w20/ru.png",
      };

      function nombreIdioma(code) {
        if (!code || code === "N/A") return null;
        return (
          I18N[currentLang].idiomas[code.toLowerCase()] || code.toUpperCase()
        );
      }

      // ── FILTROS ──
      function toggleFiltros() {
        const panel = document.getElementById("filter-panel");
        const btn = document.getElementById("btn-filtros");
        panel.classList.toggle("open");
        btn.classList.toggle("active");
      }

      function poblarSelects(comics) {
        const campos = {
          "f-genero": { key: "genero", split: true },
          "f-escritor": { key: "escritor", split: false },
          "f-dibujante": { key: "dibujante", split: false },
          "f-series": { key: "series", split: false },
          "f-idioma": { key: "idioma", split: false, map: nombreIdioma },
          "f-tag": { key: "tags", split: true },
        };
        for (const [id, cfg] of Object.entries(campos)) {
          const sel = document.getElementById(id);
          const first = sel.options[0];
          sel.innerHTML = "";
          sel.appendChild(first);
          const valores = new Set();
          comics.forEach((c) => {
            const v = c[cfg.key];
            if (!v || v === "Desconocido" || v === "N/A" || v === "Varios")
              return;
            if (cfg.split) {
              v.split(",").forEach((x) => valores.add(x.trim()));
            } else {
              valores.add(v.trim());
            }
          });
          [...valores].sort().forEach((v) => {
            const label = cfg.map ? cfg.map(v) || v : v;
            const opt = document.createElement("option");
            opt.value = v;
            opt.textContent = label;
            sel.appendChild(opt);
          });
        }
      }

      function aplicarFiltros() {
        filtrosActivos = {};
        const mapeo = {
          "f-genero": "genero",
          "f-escritor": "escritor",
          "f-dibujante": "dibujante",
          "f-series": "series",
          "f-idioma": "idioma",
          "f-tag": "tags",
        };
        for (const [id, campo] of Object.entries(mapeo)) {
          const v = document.getElementById(id).value;
          if (v) filtrosActivos[campo] = v;
        }
        renderFiltrosActivos();
        renderGrid(filtrarComics());
      }

      function filtrarComics() {
        return todosLosComics.filter((c) => {
          for (const [campo, valor] of Object.entries(filtrosActivos)) {
            const cv = c[campo] || "";
            if (campo === "tags" || campo === "genero") {
              const lista = cv.split(",").map((x) => x.trim().toLowerCase());
              if (!lista.includes(valor.toLowerCase())) return false;
            } else if (campo === "idioma") {
              if ((c.idioma || "").toLowerCase() !== valor.toLowerCase())
                return false;
            } else {
              if (!cv.toLowerCase().includes(valor.toLowerCase())) return false;
            }
          }
          if (busquedaActiva) {
            const haystack = [
              c.titulo,
              c.escritor,
              c.dibujante,
              c.genero,
              c.tags,
              c.series,
              c.sinopsis,
            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();
            if (!haystack.includes(busquedaActiva)) return false;
          }
          return true;
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      document.addEventListener("click", (e) => {
        const btn = e.target.closest(".tag-pill-link[data-tag]");
        if (btn) filtrarPorTag(btn.dataset.tag);
      });

      function filtrarPorTag(tag) {
        // Cierra visor, activa filtro por tag y abre panel
        volverALista();
        document.getElementById("f-tag").value = tag;
        aplicarFiltros();
        const panel = document.getElementById("filter-panel");
        const btn = document.getElementById("btn-filtros");
        if (!panel.classList.contains("open")) {
          panel.classList.add("open");
          btn.classList.add("active");
        }
      }

      let LABELS_FILTRO = {
        genero: "Género",
        escritor: "Escritor",
        dibujante: "Dibujante",
        series: "Serie",
        idioma: "Idioma",
        tags: "Tag",
      };

      function renderFiltrosActivos() {
        const actions = document.getElementById("filter-actions");
        const container = document.getElementById("filter-active-tags");
        const dot = document.getElementById("filter-dot");
        const n = Object.keys(filtrosActivos).length;
        dot.style.display = n > 0 ? "inline-flex" : "none";
        dot.textContent = n;
        if (n === 0) {
          actions.style.display = "none";
          return;
        }
        actions.style.display = "flex";
        container.innerHTML = "";
        for (const [campo, valor] of Object.entries(filtrosActivos)) {
          const label =
            campo === "idioma" ? nombreIdioma(valor) || valor : valor;
          const btn = document.createElement("button");
          btn.className = "filter-active-tag";
          btn.innerHTML = `${LABELS_FILTRO[campo]}: ${label} ✕`;
          btn.onclick = () => {
            const selectMap = {
              genero: "f-genero",
              escritor: "f-escritor",
              dibujante: "f-dibujante",
              series: "f-series",
              idioma: "f-idioma",
              tags: "f-tag",
            };
            document.getElementById(selectMap[campo]).value = "";
            aplicarFiltros();
          };
          container.appendChild(btn);
        }
      }

      function limpiarFiltros() {
        [
          "f-genero",
          "f-escritor",
          "f-dibujante",
          "f-series",
          "f-idioma",
          "f-tag",
        ].forEach((id) => (document.getElementById(id).value = ""));
        filtrosActivos = {};
        renderFiltrosActivos();
        renderGrid(filtrarComics());
      }

      // ── BUSCADOR ──
      function toggleBuscador() {
        const panel = document.getElementById("search-panel");
        const btn = document.getElementById("btn-buscar");
        const isOpen = panel.classList.toggle("open");
        btn.classList.toggle("active", isOpen);
        if (isOpen) {
          setTimeout(
            () => document.getElementById("search-input").focus(),
            340,
          );
        } else {
          limpiarBusqueda();
        }
      }

      function buscarComics(valor) {
        busquedaActiva = valor.trim().toLowerCase();
        document.getElementById("search-clear").style.display = busquedaActiva
          ? "block"
          : "none";
        const resultados = filtrarComics();
        renderGrid(resultados);
        document.getElementById("search-count").textContent = busquedaActiva
          ? tResults(resultados.length)
          : "";
      }

      function limpiarBusqueda() {
        busquedaActiva = "";
        const input = document.getElementById("search-input");
        if (input) input.value = "";
        const clear = document.getElementById("search-clear");
        if (clear) clear.style.display = "none";
        const count = document.getElementById("search-count");
        if (count) count.textContent = "";
        renderGrid(filtrarComics());
      }

      // ── RENDER GRID ──
      function renderSkeletons(n = 8) {
        const c = document.getElementById("contenedor-comics");
        c.innerHTML = "";
        for (let i = 0; i < n; i++) {
          c.innerHTML += `<div class="skeleton-card">
            <div class="skeleton-img"></div>
            <div class="skeleton-text" style="width:70%"></div>
            <div class="skeleton-text" style="width:45%;margin-top:6px"></div>
          </div>`;
        }
      }

      function renderGrid(comics) {
        const contenedor = document.getElementById("contenedor-comics");
        document.getElementById("count-badge").textContent = comics.length;
        contenedor.innerHTML = "";
        if (comics.length === 0) {
          contenedor.innerHTML = `<div class="no-results">${t("noResults")}</div>`;
          return;
        }
        comics.forEach((comic, i) => {
          const div = document.createElement("div");
          div.className = "comic-card";
          div.style.animationDelay = `${i * 40}ms`;
          div.onclick = () => abrirComic(comic);
          let badges = "";
          if (comic.genero)
            badges += `<span class="badge badge-genre">${comic.genero === "Varios" ? t("varios") : comic.genero}</span>`;
          if (comic.anio)
            badges += `<span class="badge badge-year">${comic.anio}</span>`;
          const langCode = (comic.idioma || "").toLowerCase();
          const langFlag = LANG_FLAGS[langCode];
          const langName = nombreIdioma(comic.idioma);
          if (langFlag) badges += `<span class="badge badge-lang"><img src="${langFlag}" alt="${langName || langCode}" title="${langName || langCode}"></span>`;
          else if (langName) badges += `<span class="badge badge-lang">${langName}</span>`;
          div.innerHTML = `
            <span class="card-corner">${t("read")}</span>
            <img src="${comic.portada_url}" alt="${comic.titulo}" loading="lazy">
            <div class="card-info">
              <h3>${comic.titulo}</h3>
              ${comic.escritor && comic.escritor !== "Desconocido" ? `<p class="comic-author">${comic.escritor}</p>` : ""}
              ${badges ? `<div class="comic-badges">${badges}</div>` : ""}
            </div>`;
          contenedor.appendChild(div);
        });
      }

      // ── CARGAR COMICS ──
      async function cargarComics() {
        const contenedor = document.getElementById("contenedor-comics");
        renderSkeletons();
        try {
          const respuesta = await axios.get(`${API_URL}/api/comics`);
          todosLosComics = respuesta.data;
          poblarSelects(todosLosComics);
          renderGrid(todosLosComics);
        } catch (error) {
          contenedor.innerHTML = `<div class="error-box">
            <strong>${t("errorConn")}</strong>
            <p>${t("errorMsg")}<br><em>${error.message}</em></p>
          </div>`;
          document.getElementById("count-badge").textContent = "!";
        }
      }

      function slugify(titulo) {
        return titulo
          .replace(/[^a-zA-Z0-9\s]/g, "")
          .trim()
          .replace(/\s+/g, "-");
      }

      // ── ABRIR COMIC ──
      async function abrirComic(comic, { fromHistory = false } = {}) {
        if (!fromHistory) {
          history.pushState({ view: "comic", comicId: comic.id }, "", "/" + slugify(comic.titulo));
        }

        const catalogo = document.getElementById("contenedor-comics");

        if (fromHistory && catalogo.style.display === "grid") {
          catalogo.classList.add("nav-forward-out");
          await new Promise((r) => setTimeout(r, 190));
          catalogo.classList.remove("nav-forward-out");
        }

        catalogo.style.display = "none";
        document.getElementById("toolbar").style.display = "none";
        document.getElementById("filter-panel").style.display = "none";
        document.getElementById("search-panel").style.display = "none";
        cerrarCompartir();

        const visor = document.getElementById("visor");
        const contenedorPaginas = document.getElementById("contenedor-paginas");
        document.getElementById("visor-titulo").textContent = comic.titulo;

        const lang = nombreIdioma(comic.idioma);
        const infoBox = document.getElementById("visor-info-box");
        infoBox.innerHTML = `
          <div class="info-field info-full">
            <span class="info-label">${t("lTitle")}</span>
            <span class="info-value title-value">${comic.titulo}</span>
          </div>
          <hr class="info-divider">
          ${
            comic.escritor && comic.escritor !== "Desconocido"
              ? `
          <div class="info-field">
            <span class="info-label">${t("lAuthor")}</span>
            <span class="info-value">${comic.escritor}</span>
          </div>`
              : ""
          }
          ${
            comic.dibujante
              ? `
          <div class="info-field">
            <span class="info-label">${t("lArtist")}</span>
            <span class="info-value">${comic.dibujante}</span>
          </div>`
              : ""
          }
          ${
            comic.traductor
              ? `
          <div class="info-field">
            <span class="info-label">${t("lTranslator")}</span>
            <span class="info-value">${comic.traductor}</span>
          </div>`
              : ""
          }
          ${
            comic.anio
              ? `
          <div class="info-field">
            <span class="info-label">${t("lYear")}</span>
            <span class="info-value">${comic.anio}</span>
          </div>`
              : ""
          }
          ${
            comic.genero && comic.genero !== "Varios"
              ? `
          <div class="info-field">
            <span class="info-label">${t("lGenre")}</span>
            <div class="info-badges">
              ${comic.genero
                .split(",")
                .map(
                  (g) => `<span class="badge badge-genre">${g.trim()}</span>`,
                )
                .join("")}
            </div>
          </div>`
              : ""
          }
          ${
            lang
              ? `
          <div class="info-field">
            <span class="info-label">${t("lLanguage")}</span>
            <span class="info-value">${lang}</span>
          </div>`
              : ""
          }
          ${
            comic.series
              ? `
          <div class="info-field">
            <span class="info-label">${t("lSeries")}</span>
            <span class="info-value">${comic.series}</span>
          </div>`
              : ""
          }
          ${
            comic.sinopsis && comic.sinopsis !== "Sin descripción disponible."
              ? `
          <hr class="info-divider">
          <div class="info-field info-full">
            <span class="info-label">${t("lSynopsis")}</span>
            <p class="info-sinopsis">${comic.sinopsis}</p>
          </div>`
              : ""
          }
          ${
            comic.autor_url
              ? `
          <hr class="info-divider">
          <div class="info-field info-full">
            <a class="btn-autoria" href="${comic.autor_url}" target="_blank" rel="noopener noreferrer">
              <span class="btn-autoria-left">${t("artistBtn")}</span>
              <span class="btn-autoria-right">${t("authorshipBtn")}
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
              </span>
            </a>
          </div>`
              : ""
          }
          ${
            comic.tags
              ? `
          <hr class="info-divider">
          <div class="info-field info-full">
            <span class="info-label">${t("lTags")}</span>
            <div class="info-tags">
              ${comic.tags
                .split(",")
                .map((tag) => {
                  const tagTrim = tag.trim();
                  return `<button class="tag-pill tag-pill-link" data-tag="${escapeHtml(tagTrim)}">${escapeHtml(tagTrim)}</button>`;
                })
                .join("")}
            </div>
          </div>`
              : ""
          }
        `;

        // Resetear contador
        const pageCounter = document.getElementById("page-counter");
        pageCounter.style.display = "none";
        pageCounter.textContent = "";
        pageCounter.classList.remove("ultima-pagina");

        visor.style.display = "block";
        if (fromHistory) {
          visor.classList.add("nav-forward-in");
          setTimeout(() => visor.classList.remove("nav-forward-in"), 280);
        }
        updateBtn(document.documentElement.classList.contains("dark"));
        contenedorPaginas.innerHTML = `<div class="loading-pages">${t("loading")}</div>`;

        // Observer solo para la animación de aparición de páginas
        const observer = new IntersectionObserver(
          (entries) =>
            entries.forEach((e) => {
              if (e.isIntersecting) e.target.classList.add("aparecer");
              else e.target.classList.remove("aparecer");
            }),
          { threshold: 0.05 },
        );

        try {
          const respuesta = await axios.get(
            `${API_URL}/api/comics/${comic.id}/paginas`,
          );
          const paginas = respuesta.data;
          contenedorPaginas.innerHTML = "";
          pageCounter.dataset.total = paginas.length;

          paginas.forEach((pagina, index) => {
            const img = document.createElement("img");
            img.src = pagina.imagen_url;
            img.className = "pagina-comic";
            img.loading = "lazy";
            img.alt = "Página";
            img.dataset.pageIndex = index + 1;
            contenedorPaginas.appendChild(img);
            observer.observe(img);
          });

          // ── Scroll listener para el contador de páginas ──
          const total = paginas.length;
          maxPaginaVista = 0;
          saltarScrollHandler = false;

          if (scrollHandlerLectura) {
            window.removeEventListener("scroll", scrollHandlerLectura);
          }

          scrollHandlerLectura = () => {
            if (saltarScrollHandler) {
              if (window.scrollY < 5) saltarScrollHandler = false;
              else return;
            }
            const imgs = contenedorPaginas.querySelectorAll("img.pagina-comic");
            const visorHeaderH =
              document.querySelector(".visor-header")?.offsetHeight || 60;
            let paginaActual = 0;

            for (const img of imgs) {
              const rect = img.getBoundingClientRect();
              // Primera imagen cuyo borde inferior supera la línea del header
              if (rect.bottom > visorHeaderH + 10) {
                paginaActual = parseInt(img.dataset.pageIndex || 0);
                break;
              }
            }

            if (paginaActual > 0) {
              pageCounter.textContent = `${paginaActual} / ${total}`;
              pageCounter.style.display = "";

              if (paginaActual > maxPaginaVista) {
                maxPaginaVista = paginaActual;
              }

              const llegaFinal = maxPaginaVista >= total;
              pageCounter.classList.toggle("ultima-pagina", llegaFinal);

              if (llegaFinal) {
                const fin = document.getElementById("comic-fin-section");
                if (fin && fin.style.display !== "flex") {
                  fin.style.display = "flex";
                }
              }
            }
          };

          window.addEventListener("scroll", scrollHandlerLectura, {
            passive: true,
          });
          // Lanzar una vez para mostrar "1 / N" sin necesidad de hacer scroll
          setTimeout(scrollHandlerLectura, 120);

          if (comic.tags) {
            const tagFooter = document.createElement("div");
            tagFooter.className = "tags-footer";
            tagFooter.innerHTML = `
              <span class="tags-footer-label">${t("lTags")}</span>
              <div class="info-tags">
                ${comic.tags
                  .split(",")
                  .map((tg) => {
                    const tag = tg.trim();
                    return `<button class="tag-pill tag-pill-link" data-tag="${escapeHtml(tag)}">${escapeHtml(tag)}</button>`;
                  })
                  .join("")}
              </div>`;
            contenedorPaginas.appendChild(tagFooter);
          }

          // Sección "Comic Terminado"
          const finSection = document.createElement("div");
          finSection.id = "comic-fin-section";
          finSection.className = "comic-fin";
          finSection.innerHTML = `
            <div class="comic-fin-bar"></div>
            <div class="comic-fin-title">${t("comicFinTitle")}</div>
            <p class="comic-fin-sub">${comic.titulo}</p>
            <button class="btn-volver-inicio" onclick="volverAlPrincipio()">
              <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
              </svg>
              ${t("backToTop")}
            </button>`;
          contenedorPaginas.appendChild(finSection);

          // Observer dedicado a la última imagen — garantiza que la sección
          // "Comic Terminado" aparezca sin importar la velocidad de scroll
          if (lastImgObserver) lastImgObserver.disconnect();
          const allImgs = contenedorPaginas.querySelectorAll("img.pagina-comic");
          const lastImg = allImgs[allImgs.length - 1];
          if (lastImg) {
            lastImgObserver = new IntersectionObserver(
              (entries) => {
                if (entries[0].isIntersecting) {
                  maxPaginaVista = total;
                  const fin = document.getElementById("comic-fin-section");
                  if (fin && fin.style.display !== "flex") fin.style.display = "flex";
                  pageCounter.classList.add("ultima-pagina");
                  pageCounter.textContent = `${total} / ${total}`;
                }
              },
              { threshold: 0 }
            );
            lastImgObserver.observe(lastImg);
          }
        } catch (error) {
          contenedorPaginas.innerHTML = `<div class="error-box"><strong>${t("errorLoad")}</strong><p>${error.message}</p></div>`;
        }
      }

      function volverAlPrincipio() {
        const btn = document.querySelector(".btn-volver-inicio");
        if (btn) {
          btn.classList.add("saliendo");
          btn.addEventListener(
            "animationend",
            () => {
              saltarScrollHandler = true;
              maxPaginaVista = 0;
              const fin = document.getElementById("comic-fin-section");
              if (fin) fin.style.display = "none";
              const counter = document.getElementById("page-counter");
              if (counter) counter.classList.remove("ultima-pagina");
              window.scrollTo({ top: 0, behavior: "smooth" });
            },
            { once: true },
          );
        } else {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }

      function volverALista(animated = false) {
        if (window.location.pathname !== "/") {
          history.pushState({ view: "catalog" }, "", "/");
        }
        if (scrollHandlerLectura) {
          window.removeEventListener("scroll", scrollHandlerLectura);
          scrollHandlerLectura = null;
        }
        if (lastImgObserver) {
          lastImgObserver.disconnect();
          lastImgObserver = null;
        }

        const visor = document.getElementById("visor");
        const catalogo = document.getElementById("contenedor-comics");

        function mostrarCatalogo() {
          visor.style.display = "none";
          catalogo.style.display = "grid";
          document.getElementById("toolbar").style.display = "flex";
          document.getElementById("filter-panel").style.display = "";
          document.getElementById("search-panel").style.display = "";
          window.scrollTo({ top: 0, behavior: animated ? "instant" : "smooth" });
          if (animated) {
            catalogo.classList.add("nav-back-in");
            setTimeout(() => catalogo.classList.remove("nav-back-in"), 280);
          }
        }

        if (animated && visor.style.display === "block") {
          visor.classList.add("nav-back-out");
          setTimeout(() => {
            visor.classList.remove("nav-back-out");
            mostrarCatalogo();
          }, 190);
        } else {
          mostrarCatalogo();
        }
      }

      // Duraciones en ms — deben coincidir exactamente con las del CSS
      const DUR_SALIDA = 160; // catalogoSalir / shareSalida
      const DUR_ENTRADA = 420; // catalogoEntrar / shareEntrada

      function toggleCompartir() {
        if (transicionando) return;

        const panel = document.getElementById("share-panel");
        const catalogo = document.getElementById("contenedor-comics");
        const isOpen = panel.classList.contains("open");

        transicionando = true;
        document
          .querySelectorAll(".btn-share-toggle")
          .forEach((b) => b.classList.toggle("active", !isOpen));

        if (!isOpen) {
          // Cerrar otros paneles
          document.getElementById("filter-panel")?.classList.remove("open");
          document.getElementById("btn-filtros")?.classList.remove("active");
          document.getElementById("search-panel")?.classList.remove("open");
          document.getElementById("btn-buscar")?.classList.remove("active");

          // Catálogo sale → formulario entra
          catalogo.classList.add("catalogo-saliendo");
          setTimeout(() => {
            catalogo.classList.remove("catalogo-saliendo");
            catalogo.style.display = "none";
            panel.classList.add("open");
            setTimeout(() => {
              transicionando = false;
            }, DUR_ENTRADA);
          }, DUR_SALIDA);
        } else {
          // Formulario sale → catálogo entra
          panel.classList.add("cerrando");
          setTimeout(() => {
            panel.classList.remove("open", "cerrando");
            catalogo.style.display = "grid";
            void catalogo.offsetWidth; // fuerza reflow para que la animación arranque limpia
            catalogo.classList.add("catalogo-apareciendo");
            setTimeout(() => {
              catalogo.classList.remove("catalogo-apareciendo");
              transicionando = false;
            }, DUR_ENTRADA);
          }, DUR_SALIDA);
        }
      }

      function cerrarCompartir() {
        // Cierre silencioso para uso interno (abrirComic) — sin mostrar catálogo
        const panel = document.getElementById("share-panel");
        if (!panel.classList.contains("open")) return;
        panel.classList.remove("open", "cerrando");
        document
          .querySelectorAll(".btn-share-toggle")
          .forEach((b) => b.classList.remove("active"));
      }

      async function enviarCompartir(e) {
        e.preventDefault();
        const form = document.getElementById("share-form");
        const submitBtn = form.querySelector(".share-submit");
        const msgEl = document.getElementById("share-msg");

        const titulo = document.getElementById("share-titulo").value.trim();
        const autor = document.getElementById("share-autor").value.trim();
        const enlace = document.getElementById("share-enlace").value.trim();
        const sinopsis = document.getElementById("share-sinopsis").value.trim();

        const originalText = submitBtn.textContent;
        submitBtn.textContent = t("shareSending");
        submitBtn.disabled = true;
        msgEl.textContent = "";
        msgEl.className = "share-msg";

        try {
          await axios.post(
            "https://formsubmit.co/ajax/ovejaseggs54@gmail.com",
            {
              _subject: "🚨 H4All Comics ¡Nueva propuesta de cómic!",
              titulo,
              autor,
              enlace,
              sinopsis,
            },
            { headers: { Accept: "application/json" } },
          );
          form.reset();
          alert(t("shareSuccess"));
          toggleCompartir();
        } catch {
          msgEl.textContent = t("shareError");
          msgEl.classList.add("share-msg--err");
        } finally {
          submitBtn.textContent = originalText;
          submitBtn.disabled = false;
        }
      }

      // ── TÉRMINOS Y CONDICIONES ──


      function renderTnc() {
        const d = (I18N[currentLang] || I18N.es || {}).tnc || {};
        document.getElementById("tnc-main-title").textContent = d.title || "";
        document.getElementById("tnc-meta").textContent = d.meta || "";
        document.getElementById("tnc-body").innerHTML = d.body || "";
      }

      function abrirTerminos() {
        renderTnc();
        const overlay = document.getElementById("tnc-overlay");
        overlay.classList.remove("closing");
        overlay.classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function cerrarTerminos() {
        const overlay = document.getElementById("tnc-overlay");
        if (!overlay.classList.contains("open")) return;
        overlay.classList.add("closing");
        setTimeout(() => {
          overlay.classList.remove("open", "closing");
          document.body.style.overflow = "";
        }, 210);
      }
      function cerrarTerminosOverlay(e) {
        if (e.target === e.currentTarget) cerrarTerminos();
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") cerrarTerminos();
      });

      async function cargarComicsYRuta() {
        await cargarComics();
        const slug = window.location.pathname.slice(1);
        if (slug) {
          const comic = todosLosComics.find(c => slugify(c.titulo) === slug);
          if (comic) {
            history.replaceState({ view: "comic", comicId: comic.id }, "", "/" + slug);
            abrirComic(comic, { fromHistory: true });
            return;
          }
        }
        history.replaceState({ view: "catalog" }, "", "/");
      }

      cargarComicsYRuta();

      // ── History API: back / forward del navegador ──

      window.addEventListener("popstate", (e) => {
        const state = e.state;
        if (!state) return;

        const visor = document.getElementById("visor");

        if (state.view === "catalog") {
          // Botón atrás: animar solo si el visor está explícitamente visible
          if (visor.style.display === "block") {
            volverALista(true);
          } else if (visor.style.display !== "block") {
            // Ya estamos en el catálogo, solo asegurar que se muestre
            document.getElementById("contenedor-comics").style.display = "grid";
            document.getElementById("toolbar").style.display = "flex";
          }
        } else if (state.view === "comic") {
          // Botón adelante: abrir cómic si no está ya en el visor
          if (visor.style.display !== "block") {
            const comic = todosLosComics.find((c) => c.id === state.comicId);
            if (comic) abrirComic(comic, { fromHistory: true });
          }
        }
      });
    </script>

    <!-- Modal: Términos y Condiciones -->
    <div class="tnc-overlay" id="tnc-overlay" onclick="cerrarTerminosOverlay(event)">
      <div class="tnc-card">
        <button class="tnc-close" onclick="cerrarTerminos()" aria-label="Cerrar">✕</button>
        <div class="tnc-header">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"/>
          </svg>
          <span class="tnc-main-title" id="tnc-main-title">Términos y Condiciones</span>
        </div>
        <p class="tnc-meta" id="tnc-meta">Versión 2026.3.3 · Última revisión: 27 de mayo de 2026 · Estatus: Vigente / Público</p>
        <div class="tnc-body" id="tnc-body"></div>
      </div>
    </div>
  </body>
</html>
